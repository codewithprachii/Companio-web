<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Companio</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div id="app">

    <main class="splash-screen">

        <!-- Floating dots -->
        <span class="floating-dot dot-1"></span>
        <span class="floating-dot dot-2"></span>
        <span class="floating-dot dot-3"></span>
        <span class="floating-dot dot-4"></span>
        <span class="floating-dot dot-5"></span>

        <!-- Golden orbit -->
        <div class="orbit">
            <div class="orbit-flower"></div>
        </div>

        <!-- Logo + name -->
        <div class="splash-content">

            <div class="flower-logo">
                <img src="/static/companio_logo_transparent.png" alt="Companio logo">
            </div>

            <h1>Companio</h1>

            <p>A COMPANION FOR EVERY DAY.</p>

        </div>

        <!-- Loading -->
        <div class="loading-section">

            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>

            <div class="loading-info">
                <span>Loading...</span>
                <span id="loading-percentage">0%</span>
            </div>

        </div>

    </main>

</div>

    <script src="/static/script.js"></script>
</body>
</html>
